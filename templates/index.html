<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fruit Quality Classifier</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>🍎 Fruit Quality Classifier 🍌</h1>

    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="file" accept="image/*" required>
      <button type="submit">Predict</button>
    </form>

    {% if image_url %}
      <h3>Uploaded Image:</h3>
      <img src="{{ image_url }}" alt="Uploaded fruit image" class="preview">
    {% endif %}

    {% if prediction %}
      <div class="result {{ 'good' if prediction == 'Good' else 'bad' }}">
        Prediction: The fruit is {{ prediction.upper() }}
        {% if confidence %} ({{ confidence }}%) {% endif %}
      </div>
    {% endif %}
  </div>
</body>
</html>
